# Exclude all files inside tests/ folder
exclude: "^tests/.*$"

repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.11.5
    hooks:
      - id: isort
        name: python - isort
        args: ['--sl', '-l', '100', '--profile', 'black']
        files: '\.py$'

  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
        name: python - black
        args: ['-l', '100']
        files: '\.py$'
